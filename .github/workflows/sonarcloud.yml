name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Test and analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.5"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py train.py tests

      - name: Download training dataset
        run: |
          mkdir -p data
          curl --fail --location --retry 3 \
            https://archive.ics.uci.edu/static/public/228/sms+spam+collection.zip \
            --output "$RUNNER_TEMP/sms-spam-collection.zip"
          unzip -o "$RUNNER_TEMP/sms-spam-collection.zip" SMSSpamCollection -d data
          test -s data/SMSSpamCollection

      - name: Train model
        run: python train.py

      - name: Run tests and generate coverage
        run: >
          python -m pytest tests -v
          --cov
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}